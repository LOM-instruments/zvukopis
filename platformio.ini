; Waveshare ESP32-S3-ePaper-3.97
; ESP32-S3R8 (8 MB octal PSRAM), 16 MB flash, 800x480 e-paper over SPI.
; Settings mirror Waveshare's Arduino IDE configuration for this board.

[env:esp32s3-epaper]
platform = espressif32@^6.0.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial goes over the board's native USB port
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; USB microphone (src/usbmic.cpp): TinyUSB's audio class from lib/tinyusb_audio,
    ; one mono 16-bit stream at the sample rate (change both rates for a 48 kHz build)
    -DCFG_TUD_AUDIO=1
    -DCFG_TUD_AUDIO_FUNC_1_DESC_LEN=TUD_AUDIO_MIC_ONE_CH_DESC_LEN
    -DCFG_TUD_AUDIO_FUNC_1_N_AS_INT=1
    -DCFG_TUD_AUDIO_FUNC_1_CTRL_BUF_SZ=64
    -DCFG_TUD_AUDIO_ENABLE_EP_IN=1
    -DCFG_TUD_AUDIO_FUNC_1_N_BYTES_PER_SAMPLE_TX=2
    -DCFG_TUD_AUDIO_FUNC_1_N_CHANNELS_TX=1
    -DCFG_TUD_AUDIO_FUNC_1_SAMPLE_RATE_TX=96000
    -DCFG_TUD_AUDIO_FUNC_1_EP_IN_SZ_MAX=194
    -DCFG_TUD_AUDIO_FUNC_1_EP_IN_SW_BUF_SZ=12288
    -DCFG_TUD_AUDIO_EP_IN_FLOW_CONTROL=1

monitor_speed = 115200
; Don't let the monitor toggle DTR/RTS on connect: on the native USB port they
; drive reset and BOOT, and would bounce the board into download mode
monitor_dtr = 0
monitor_rts = 0

upload_speed = 921600
; An RTS reset after flashing lands this board in download mode, so the upload
; leaves the chip alone and scripts/reset_after_upload.py does a watchdog reset
board_upload.after_reset = no_reset
extra_scripts =
    pre:scripts/version_flag.py
    post:scripts/reset_after_upload.py

lib_deps =
    lewisxhe/XPowersLib@^0.2.0
    adafruit/Adafruit GFX Library@^1.11.9

; The build the web flasher ships: the same, without src/wifi_config.h, so no
; one's network credentials end up in a public binary
[env:release]
extends = env:esp32s3-epaper
build_flags =
    ${env:esp32s3-epaper.build_flags}
    -DNO_WIFI_CONFIG

