name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run
      - name: Prepare the flasher files
        run: python3 scripts/make_release.py "ci-${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        with:
          name: zvukopis-firmware
          path: |
            docs/firmware/
            docs/manifest.json
