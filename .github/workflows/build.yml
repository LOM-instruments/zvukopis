name: Build

on:
  push:
  pull_request:

# The job reads the repository and nothing else: no write access for a pull
# request's code to borrow
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Each action is pinned to the commit its version tag named when it was
      # added, so a moved tag cannot change what runs here
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No later step talks to GitHub, so the token is not left in .git/config
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Build
        run: pio run
      - name: Prepare the flasher files
        run: python3 scripts/make_release.py "ci-${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zvukopis-firmware
          path: |
            docs/firmware/
            docs/manifest.json
